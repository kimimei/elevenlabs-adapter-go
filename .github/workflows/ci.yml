name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # 跟着 go.mod 里的版本走，避免本地能编译、CI 报 "go.mod requires go >= x"
          go-version-file: go.mod
          cache: true

      # Python 放在冒烟之前：冒烟、验收、崩溃回归三个脚本都在同一 job 里，
      # 放在中间会让「哪一步需要哪个运行时」变成隐藏依赖。
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 静态检查
        run: |
          go vet ./...
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，先跑 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: 单元测试
        run: go test ./...

      - name: 编译（静态，与生产同参数）
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bin/adapter ./cmd/adapter

      - name: 端到端冒烟
        run: bash scripts/smoke.sh

      - name: 功能可用性验收
        run: python scripts/acceptance.py

      - name: 崩溃恢复回归
        run: python scripts/crash_recovery_check.py

  # 发布前门禁单独一个 job：它要扫 git 历史，必须 fetch-depth: 0。
  # 混在主 job 里只能拿到浅克隆，历史扫描就只看得到最近一个提交 ——
  # 那种「通过」是假通过，比不扫更危险。
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 先证明规则有效，再用它下结论。顺序反了，一个坏掉的门禁
      # 也会告诉你「全部通过」。
      - name: 门禁反证
        run: go run ./cmd/release-check -self-test

      - name: 敏感信息扫描（内容 + 历史）
        run: go run ./cmd/release-check
        env:
          # 私有域名清单不进仓库，CI 里走 secrets。
          # 未配置时只跑通用规则，不影响其余检查。
          RELEASE_CHECK_INTERNAL_HOSTS: ${{ secrets.RELEASE_CHECK_INTERNAL_HOSTS }}

  # test-race 单独一个 job：它需要 CGO 与 C 工具链，失败原因与普通测试不同，
  # 混在一起会让人分不清「逻辑错了」还是「环境缺工具」。
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: 并发检测（账本是并发写入点）
        shell: bash
        run: |
          set +e
          go test -race ./... >race.log 2>&1
          rc=$?
          cat race.log
          if [ $rc -ne 0 ]; then
            # job 日志要仓库管理员权限才能下载，注解却是匿名可读的。
            # 不把摘录塞进注解，排查的人（以及没配 token 的自动化）就只能
            # 看到一句 "Process completed with exit code 1"，等于什么都没说。
            # 工作流命令里换行必须写成 %0A，% 本身要先转义成 %25。
            digest="$(head -n 40 race.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=race 检测失败（前 40 行）::${digest}"
          fi
          exit $rc
